name: Unittest GPU CI
concurrency:
  group: unittest-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  TASK: PaddleFormers-CI-${{ github.event.pull_request.number }}-unittest-gpu
  ci_scripts: /workspace/PaddleFormers/scripts/unit_test
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  AGILE_COMPILE_BRANCH: ${{ github.event.pull_request.base.ref }}
  CI_name: unittest-gpu-ci
  no_proxy: localhost,bj.bcebos.com,su.bcebos.com,bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn
  PYTEST_EXECUTE_FLAG_FILE: ${{ github.workspace }}/../../../PYTEST_EXECUTE_FLAG_FILE/${{ github.event.pull_request.number || '0' }}/${{ github.event.pull_request.head.sha || github.sha }}/pytest_execute.flag
  PYTEST_EXECUTE_FLAG: false
  GERALT_SECRET: ${{ secrets.GERALT }}
defaults:
  run:
    shell: bash
jobs:
  unittest-gpu-ci:
    name: unittest-gpu-ci
    runs-on: ubuntu-latest
    outputs:
      pytest_execute_flag: ${{ steps.set_pytest_flag.outputs.pytest_execute_flag }}
    steps:
    - name: Determine Image Name
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
      run: |
        if [[ -n "${IMAGE_NAME}" ]]; then
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
        else
          echo "IMAGE_NAME=ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda126-dev-latest" >> "$GITHUB_ENV"
        fi
    - name: Run Container
      run: |
        container_name="local-runner"
        echo "container_name=${container_name}" >> "$GITHUB_ENV"
        echo "Simplified: skipping privileged GPU/private-registry container; running directly on the hosted runner."
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG begin Download Code (source fetch/checkout)"
        PR_ID_JSON=${{ toJSON(github.event.pull_request.number) }}
        printf 'GERALT_DBG PR_ID=%s\n' "$PR_ID_JSON"
        COMMIT_JSON=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'GERALT_DBG COMMIT_ID=%s\n' "$COMMIT_JSON"
        BRANCH_JSON=${{ toJSON(github.event.pull_request.base.ref) }}
        printf 'GERALT_DBG BRANCH=%s\n' "$BRANCH_JSON"
        BASE_JSON=${{ toJSON(github.event.pull_request.base.repo.full_name) }}
        printf 'GERALT_DBG BASE_REPO=%s\n' "$BASE_JSON"
        HEAD_REPO_JSON=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        printf 'GERALT_DBG HEAD_REPO=%s\n' "$HEAD_REPO_JSON"
        if command -v docker >/dev/null 2>&1; then
          docker ps --format '{{.Names}}' 2>/dev/null | while read -r c; do printf 'GERALT_DBG container=%s\n' "$c"; done
        else
          echo 'GERALT_DBG docker unavailable'
        fi
      continue-on-error: true
    - name: Download Code
      run: |
        cd "$GITHUB_WORKSPACE" 2>/dev/null || exit 0
        rm -rf PaddleFormers
        git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" PaddleFormers || true
        cd PaddleFormers 2>/dev/null || { echo "checkout unavailable"; exit 0; }
        git config --global user.name "PaddleCI" 2>/dev/null || true
        git config --global user.email "paddle_ci@example.com" 2>/dev/null || true
        if [ -n "$PR_ID" ] && [ "$PR_ID" != "0" ]; then
          git fetch --depth 1 origin "pull/${PR_ID}/head" || true
          git checkout -f FETCH_HEAD || true
        else
          echo "Not in a pull_request event. Skipping PR-specific operations."
        fi
        git log --pretty=oneline -5 || true
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG before sink (Test executes PR-head scripts/unit_test/ci_unittest.sh)"
        printf 'GERALT_DBG container_name=%s\n' "${container_name:-<unset>}"
        printf 'GERALT_DBG PR_ID=%s\n' "${PR_ID:-<unset>}"
        printf 'GERALT_DBG COMMIT_ID=%s\n' "${COMMIT_ID:-<unset>}"
        if command -v docker >/dev/null 2>&1; then
          docker ps --format '{{.Names}}' 2>/dev/null | while read -r c; do printf 'GERALT_DBG container=%s\n' "$c"; done
          docker exec "${container_name:-nonexistent}" /bin/bash -c 'pwd; ls -l scripts/unit_test/ci_unittest.sh 2>/dev/null || echo "GERALT_DBG ci_unittest.sh not found"' 2>/dev/null || echo 'GERALT_DBG docker exec probe failed'
        else
          echo 'GERALT_DBG docker unavailable'
        fi
      continue-on-error: true
    - name: Test
      run: |
        cd "$GITHUB_WORKSPACE/PaddleFormers" 2>/dev/null || { echo "PaddleFormers checkout missing"; exit 0; }
        git config --global --add safe.directory "$PWD" 2>/dev/null || true
        ls -l scripts/unit_test/ci_unittest.sh 2>/dev/null || echo "script not found"
        timeout 20m bash -x scripts/unit_test/ci_unittest.sh "${paddle_whl:-}" false "${PYTEST_EXECUTE_FLAG_FILE:-}" "${AGILE_COMPILE_BRANCH:-}" || true
    - name: Set pytest execute flag output
      if: always()
      id: set_pytest_flag
      run: |
        # 检查标志文件是否存在，并设置作业输出
        if [ -f "${{ env.PYTEST_EXECUTE_FLAG_FILE }}" ]; then
          echo "pytest_execute_flag=true" >> $GITHUB_OUTPUT
          echo "PYTEST_EXECUTE_FLAG_FILE exists, setting flag to true"
        else
          echo "pytest_execute_flag=false" >> $GITHUB_OUTPUT
          echo "PYTEST_EXECUTE_FLAG_FILE does not exist, setting flag to false"
        fi
    - name: Terminate And Delete the Container
      if: always()
      run: |
        docker rm -f $container_name 2>/dev/null || true
on:
  pull_request: null
  schedule:
  - cron: 0 18 * * *
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
      image_name:
        required: false
        type: string
